<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Mosaic</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">

</head>

<body>



    <main class="mosaic-dashboard">

  <!-- =========================
     Timeline
========================== -->
<div class="mosaic-clock">
    <div id="clock-time" class="clock-time"></div>
    <div id="clock-day" class="clock-day"></div>
</div>
<header class="dashboard-zone planning-zone">

    <div class="zone-content">

        <div class="week-navigation">

            <button id="prev-week" class="nav-arrow">
                &#10094;
            </button>

            <div class="timeline-center">

                <button id="home-day" class="home-day-button">
                    Home
                </button>

                <div id="week-grid" class="week-grid"></div>

            </div>

            <button id="next-week" class="nav-arrow">
                &#10095;
            </button>

        </div>

        <div id="today-detail-panel" class="today-detail-panel"></div>

    </div>

</header>
        <!-- =========================
             Live Zone
        ========================== -->

        <section class="dashboard-zone live-zone">

            <div>

                <p class="zone-label">
                    Live Zone
                </p>

                <h2>
                    Live Information
                </h2>

                <p class="zone-description">
                    Rotating cards for music, sports, RSS, package tracking,
                    reminders and time-sensitive information.
                </p>

            </div>

        </section>

        <!-- =========================
             Discovery Zone
        ========================== -->

        <footer class="dashboard-zone discovery-zone">

            <div>

                <p class="zone-label">
                    Discovery Zone
                </p>

                <h2>
                    Reddit & Discovery
                </h2>

                <p class="zone-description">
                    Images, animated GIFs, interesting Reddit posts,
                    photos, famous birthdays, daily facts and other
                    enjoyable content.
                </p>

            </div>

        </footer>

    </main>

    <script src="js/app.js"></script>

</body>

</html>
