<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Mosaic</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="widgets/widgets.css">

</head>

<body>


<main class="mosaic-dashboard">


<!-- =========================
     Timeline
========================== -->

<header class="dashboard-zone planning-zone">

    <div class="zone-content">

        <div class="planning-layout">

            <div class="planning-clock">

                <div class="mosaic-clock">
                    <div class="clock-display">

                        <div id="clock-time" class="clock-time"></div>

                        <div id="clock-period" class="clock-period"></div>

                    </div>
                    <div id="clock-day" class="clock-day"></div>
                </div>

            </div>

            <div class="planning-calendar">

                <div class="week-navigation">

                    <button id="prev-week" class="nav-arrow">
                        &#10094;
                    </button>

                    <div class="timeline-center">

                        <button id="home-day" class="home-day-button">
                            Return To Today
                        </button>

                        <div id="week-grid" class="week-grid"></div>

                    </div>

                    <button id="next-week" class="nav-arrow">
                        &#10095;
                    </button>

                </div>

            </div>

        </div>

        <!-- <div id="today-detail-panel" class="today-detail-panel"></div> -->

    </div>


</header>
<!-- =========================
     Live Zone
========================== -->

<section class="dashboard-zone live-zone">

    <div class="widget-grid">
    

        <section class="widget small weather-widget">

    <div class="widget-header">

        <div class="widget-title">
            Weather
        </div>

        <div class="widget-status">
            LIVE
        </div>

    </div>


    <div class="weather-content">

    <div class="weather-location">
        Tacoma
    </div>

    <div class="weather-main">

        <div class="weather-icon">
            ☀️
        </div>

        <div class="weather-temperature">
            72°
        </div>

    </div>

    <div class="weather-rotating">
        Clear Sky
    </div>

</div>


   

</section>

        <section class="widget hero music-widget">

            <div class="widget-header">
                <div class="widget-title">Now Playing</div>
                <div class="widget-status">Waiting</div>
            </div>

            <div class="widget-body">
                Nothing Playing
            </div>

            <div class="widget-footer">
                <span>Apple Music</span>
                <span>--</span>
            </div>

        </section>

        <section class="widget small sports-widget">

            <div class="widget-header">
                <div class="widget-title">Mariners</div>
                <div class="widget-status">Idle</div>
            </div>

            <div class="widget-body">
                No Game
            </div>

            <div class="widget-footer">
                <span>MLB</span>
                <span>--</span>
            </div>

        </section>

    </div>

</section>
        <!-- =========================
     Discovery Zone
========================== -->

<footer class="dashboard-zone discovery-zone">

    <div id="reddit-feed" class="reddit-feed">

        <div class="reddit-source">
            Loading Reddit
        </div>

        <div class="reddit-headline">
            Fetching top posts…
        </div>

    </div>

</footer>

            </main>

    <script src="widgets/widget-core.js"></script>
  

    <script src="js/app.js?v=2"></script>
    <script src="js/discovery.js?v=2"></script>

</body>

</html>
