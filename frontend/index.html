<body>


<div class="mosaic-viewport-stage">
<main class="mosaic-dashboard">


<!-- =========================
     Timeline
========================== -->

<header class="dashboard-zone planning-zone">

    <div class="zone-content">

        <div class="planning-layout">

            <div class="layer-3-card-surface planning-clock-surface" aria-hidden="true"></div>

            <div class="planning-clock">

                <div class="mosaic-clock">
                    <div class="clock-display">

                        <div id="clock-time" class="clock-time"></div>

                        <div id="clock-period" class="clock-period"></div>

                    </div>
                    <div id="clock-day" class="clock-day"></div>
                </div>

            </div>

            <div class="layer-3-card-surface planning-calendar-surface" aria-hidden="true"></div>

            <div class="planning-calendar">

                <div class="week-navigation">

                    <button id="prev-week" class="nav-arrow">
                        &#10094;
                    </button>

                    <div class="timeline-center">

                        <button id="home-day" class="home-day-button">
                            Return To Today
                        </button>

                        <div id="week-grid" class="week-grid"></div>

                    </div>

                    <button id="next-week" class="nav-arrow">
                        &#10095;
                    </button>

                </div>

            </div>

        </div>

        <!-- <div id="today-detail-panel" class="today-detail-panel"></div> -->

    </div>


</header>
<!-- =========================
     Live Zone
========================== -->

<section class="dashboard-zone live-zone">

    <div class="widget-grid">

        <div class="layer-3-card-surface hero-card-surface" aria-hidden="true"></div>

        <section class="widget hero-container">

        </section>

        <div class="normal-widget-host">

        <div class="normal-widget-slot normal-widget-slot--primary"
             data-normal-widget-slot="1">

        <div class="layer-3-card-surface normal-widget-surface" aria-hidden="true"></div>

        </div>

        <div class="normal-widget-slot normal-widget-slot--secondary"
             data-normal-widget-slot="2">

        <div class="layer-3-card-surface normal-widget-surface" aria-hidden="true"></div>

        </div>

        </div>

    </div>

</section>
        <!-- =========================
     Discovery Zone
========================== -->

<footer class="dashboard-zone discovery-zone">

    <div class="layer-3-card-surface discovery-card-surface" aria-hidden="true"></div>

    <section class="widget discovery-card" aria-label="Discovery"></section>

</footer>

            </main>
</div>
