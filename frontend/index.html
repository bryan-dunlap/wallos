<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Mosaic</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="widgets/widgets.css">
    <script src="js/theme.js"></script>
    <script src="layout/canvas-scale-controller.js"></script>

</head>

<body>


<div class="mosaic-viewport-stage">
<main class="mosaic-dashboard">


<!-- =========================
     Timeline
========================== -->

<header class="dashboard-zone planning-zone">

    <div class="zone-content">

        <div class="planning-layout">

            <div class="layer-3-card-surface planning-clock-surface" aria-hidden="true"></div>

            <div class="planning-clock">

                <div class="mosaic-clock">
                    <div class="clock-display">

                        <div id="clock-time" class="clock-time"></div>

                        <div id="clock-period" class="clock-period"></div>

                    </div>
                    <div id="clock-day" class="clock-day"></div>
                </div>

            </div>

            <div class="layer-3-card-surface planning-calendar-surface" aria-hidden="true"></div>

            <div class="planning-calendar">

                <div class="week-navigation">

                    <button id="prev-week" class="nav-arrow">
                        &#10094;
                    </button>

                    <div class="timeline-center">

                        <button id="home-day" class="home-day-button">
                            Return To Today
                        </button>

                        <div id="week-grid" class="week-grid"></div>

                    </div>

                    <button id="next-week" class="nav-arrow">
                        &#10095;
                    </button>

                </div>

            </div>

        </div>

        <!-- <div id="today-detail-panel" class="today-detail-panel"></div> -->

    </div>


</header>
<!-- =========================
     Live Zone
========================== -->

<section class="dashboard-zone live-zone">

    <div class="widget-grid">

        <div class="layer-3-card-surface hero-card-surface" aria-hidden="true"></div>

        <section class="widget hero-container">

        </section>

        <div class="layer-3-card-surface weather-card-surface" aria-hidden="true"></div>

        <section class="widget small weather-widget">

    <div class="widget-header">

        <div class="widget-title">
            Weather
        </div>

        <div class="widget-status">
            LIVE
        </div>

    </div>


    <div class="weather-content">

    <div id="weather-location" class="weather-location">
        —
    </div>

    <div class="weather-main">

        <div id="weather-icon" class="weather-icon">
            —
        </div>

        <div id="weather-temperature" class="weather-temperature">
            —°
        </div>

    </div>

    <div id="weather-condition" class="weather-rotating">
        Loading weather
    </div>

    <div class="weather-details">
        H <span id="weather-high">—</span>°
        · L <span id="weather-low">—</span>°
        <span id="weather-precipitation-detail" hidden>
            · Rain <span id="weather-precipitation">—</span>%
        </span>
    </div>

</div>


   

</section>

        <div class="layer-3-card-surface sports-card-surface" aria-hidden="true"></div>

        <section class="widget small sports-widget">

            <div class="widget-header">
                <div id="sports-category" class="widget-title" data-sports-field="category">Sports</div>
                <div id="sports-status" class="widget-status" data-sports-field="status">Loading</div>
            </div>

            <div id="sports-matchup" class="widget-body" data-sports-field="matchup">
                No Game
            </div>

            <div class="widget-footer">
                <span id="sports-details" data-sports-field="details">—</span>
            </div>

        </section>

    </div>

</section>
        <!-- =========================
     Discovery Zone
========================== -->

<footer class="dashboard-zone discovery-zone">

    <div class="layer-3-card-surface discovery-card-surface" aria-hidden="true"></div>

    <section class="widget discovery-card" aria-label="Discovery"></section>

</footer>

            </main>
</div>

    <script src="core/event-bus.js"></script>
    <script src="core/events.js"></script>
    <script src="providers/provider-registry.js"></script>
    <script src="providers/provider-manager.js"></script>
    <script src="providers/daily-snapshot-generator.js"></script>
    <script src="providers/sports-simulation-profile-registry.js"></script>
    <script src="providers/demo-context-provider.js"></script>
    <script src="providers/calendar-provider-registry.js"></script>
    <script src="providers/calendar-event-normalizer.js"></script>
    <script src="providers/demo-calendar-data-provider.js"></script>
    <script src="providers/ical-calendar-data-provider.js"></script>
    <script src="providers/calendar-provider.js"></script>
    <script src="providers/calendar-reminder-generator.js"></script>
    <script src="providers/discovery-rotation-controller.js"></script>
    <script src="providers/discovery-provider.js"></script>
    <script src="providers/weather-insight-generator.js"></script>
    <script src="providers/weather-provider.js"></script>
    <script src="providers/sports-active-context-generator.js"></script>
    <script src="providers/mlb-data-provider.js"></script>
    <script src="providers/mlb-gamecast-provider.js"></script>
    <script src="providers/sports-provider.js"></script>
    <script src="providers/daily-summary-provider.js"></script>
    <script src="providers/provider-bootstrap.js"></script>
    <script src="coordinator/event-coordinator.js"></script>
    <script src="coordinator/hero-coordinator.js"></script>
    <script src="widgets/widget-registry.js"></script>
    <script src="widgets/widget-manager.js"></script>
    <script src="widgets/widget-bootstrap.js"></script>
    <script src="layout/layout-manager.js"></script>
    <script src="layout/layout-bootstrap.js"></script>
    <script src="core/app-core.js"></script>

    <script src="widgets/widget-core.js"></script>
    <script src="widgets/active-renderer-registry.js"></script>
    <script src="widgets/baseball-game-renderer.js"></script>
    <script src="widgets/football-game-renderer.js"></script>
    <script src="sports/sports-event-contract.js"></script>
    <script src="sports/sports-widget-event-filter.js"></script>
    <script src="sports/sports-widget-queue.js"></script>
    <script src="sports/sports-widget-renderer-registry.js"></script>
    <script src="sports/sports-widget-scheduled-presenter.js"></script>
    <script src="sports/mlb-sports-event-adapter.js"></script>
    <script src="sports/nfl-sports-event-adapter.js"></script>
    <script src="sports/mlb-sports-widget-renderer.js"></script>
    <script src="sports/nfl-sports-widget-renderer.js"></script>
    <script src="widgets/discovery-widget.js"></script>
    <script src="widgets/hero.js"></script>
    <script src="widgets/weather-widget.js"></script>
    <script src="widgets/sports-widget.js"></script>
    <script>
        window.mosaicApp.start();
    </script>
    <script src="js/app.js?v=2"></script>

</body>

</html>
